{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta and page.meta.social_image %}
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.meta.social_title or page.title }}">
    <meta property="og:description" content="{{ page.meta.description or config.site_description }}">
    <meta property="og:image" content="{{ page.meta.social_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.meta.social_title or page.title }}">
    <meta name="twitter:description" content="{{ page.meta.description or config.site_description }}">
    <meta name="twitter:image" content="{{ page.meta.social_image }}">
  {% endif %}
{% endblock %}
