site_name: DECIMA-8 — детерминированная нейроморфная машина
site_url: https://decima.rulerom.com
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  custom_dir: overrides

plugins:
  - search
  - mermaid2

extra_css:
  - css/mermaid.css
  - assets/rulerom.css

extra:
  analytics:
    provider: yandex
    property: 107008715

nav:
  - 'Главная':
    - 'Обзор v3': index.md
    - 'IDE': tools/ide.md
    - 'Benchmark': bench/index.md

  - 'Архитектура v3':
    - 'Модель тайла': arch/tiles.md
    - 'Паттерны личности': arch/personality-patterns.md
    - 'VSB и BUS16': arch/bus.md
    - 'Такт runtime': arch/phase.md
    - 'Граф допуска': arch/routing.md

  - 'Архив v0.2':
    - 'Кодекс': codex/index.md
    - 'Контракт': CONTRACT.md
    - 'Bake TLV': spec/bake.md
    - 'Протокол': spec/protocol.md
    - 'UDP Protocol': integration/udp.md
    - 'Latch Corridor (Tier 5)': nda/latch.md
    - 'RTL (Tier 5)': nda/rtl.md

  - 'Экосистема': ecosystem.md
