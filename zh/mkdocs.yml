site_name: DECIMA-8 — 确定性神经形态机器
site_url: https://decima.rulerom.com
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  custom_dir: overrides

plugins:
  - search
  - mermaid2

extra_css:
  - css/mermaid.css
  - assets/rulerom.css

nav:
  - '主页':
    - 'v3 概述': index.md
    - 'IDE': tools/ide.md

  - 'v3 架构':
    - '图块模型': arch/tiles.md
    - '人格模式': arch/personality-patterns.md
    - 'VSB 与 BUS16': arch/bus.md
    - 'Runtime tick': arch/phase.md
    - '许可图': arch/routing.md

  - 'v0.2 存档':
    - 'Codex': codex/index.md
    - '合约': CONTRACT.md
    - 'Bake TLV': spec/bake.md
    - '协议': spec/protocol.md
    - 'UDP 协议': integration/udp.md

  - '生态系统': ecosystem.md
