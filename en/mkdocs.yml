site_name: DECIMA-8 — deterministic neuromorphic machine
site_url: https://decima.rulerom.com
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  custom_dir: overrides

plugins:
  - search
  - mermaid2

extra_css:
  - css/mermaid.css
  - assets/rulerom.css

extra:
  analytics:
    provider: yandex
    property: 107008715

nav:
  - 'Home':
    - 'v3 overview': index.md
    - 'IDE': tools/ide.md

  - 'Architecture v3':
    - 'Tile model': arch/tiles.md
    - 'Personality patterns': arch/personality-patterns.md
    - 'VSB and BUS16': arch/bus.md
    - 'Runtime tick': arch/phase.md
    - 'Permission graph': arch/routing.md

  - 'v0.2 archive':
    - 'Codex': codex/index.md
    - 'Contract': CONTRACT.md
    - 'Bake TLV': spec/bake.md
    - 'Protocol': spec/protocol.md
    - 'UDP Protocol': integration/udp.md

  - 'Ecosystem': ecosystem.md
